<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary title: leads with the full name, so both "abdullah imdad"
         and "abdullah imdad lakho" are exact matches. -->
    <title>Abdullah Imdad Lakho — BS AI Student at DUET Karachi</title>

    <meta
      name="description"
      content="Abdullah Imdad is a BS Artificial Intelligence student at Dawood University of Engineering &amp; Technology, Karachi, learning C programming, AI and data analysis."
    />

    <!-- Note: Google ignores this tag. It is kept for other engines only and
         is not a ranking factor. Real ranking work happens in the title,
         description, headings, body copy and structured data. -->
    <meta
      name="keywords"
      content="abdullah imdad, abdullah imdad lakho, abdullah imdad portfolio, abdullah imdad duet, bs artificial intelligence student karachi, ai student portfolio pakistan, dawood university of engineering and technology, duet karachi, machine learning student, data analysis, c programming, artificial intelligence portfolio, software developer karachi"
    />

    <meta name="author" content="Abdullah Imdad" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Self-referencing canonical. Keep this in sync with robots.txt,
         sitemap.xml and the JSON-LD "url" below when the domain changes. -->
    <link rel="canonical" href="https://abdullah-imdad-lakho.vercel.app/" />

    <!-- Open Graph: controls the link preview on LinkedIn, WhatsApp, Facebook, Slack. -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Abdullah Imdad" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://abdullah-imdad-lakho.vercel.app/" />
    <meta
      property="og:title"
      content="Abdullah Imdad Lakho — BS AI Student at DUET Karachi"
    />
    <meta
      property="og:description"
      content="BS Artificial Intelligence student at Dawood University of Engineering &amp; Technology (DUET), Karachi. Building foundations in C programming, artificial intelligence, machine learning and data analysis."
    />
    <!-- Bump the ?v= when og-image.png changes: social platforms cache OG
         images aggressively and will otherwise keep serving the old card. -->
    <meta
      property="og:image"
      content="https://abdullah-imdad-lakho.vercel.app/images/og-image.png?v=2"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Abdullah Imdad — BS Artificial Intelligence student at DUET Karachi"
    />
    <meta property="profile:first_name" content="Abdullah" />
    <meta property="profile:last_name" content="Imdad" />

    <!-- Twitter/X card: falls back to og:image when this is absent, but
         explicit is safer because Twitter does not read all OG fields. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Abdullah Imdad Lakho — BS AI Student at DUET Karachi"
    />
    <meta
      name="twitter:description"
      content="BS Artificial Intelligence student at DUET Karachi. Building foundations in C programming, AI, machine learning and data analysis."
    />
    <meta
      name="twitter:image"
      content="https://abdullah-imdad-lakho.vercel.app/images/og-image.png?v=2"
    />
    <meta
      name="twitter:image:alt"
      content="Abdullah Imdad — BS Artificial Intelligence student at DUET Karachi"
    />

    <!-- Icons and theme colour -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/images/og-image.png" />
    <meta name="theme-color" content="#14120f" />
    <meta name="color-scheme" content="light" />

         https://search.google.com/test/rich-results -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
