    <!-- Primary title: leads with the full name, so both "abdullah imdad"

    />

    <!-- Note: Google ignores this tag. It is kept for other engines only and
         is not a ranking factor. Real ranking work happens in the title,
         description, headings, body copy and structured data. -->
    <meta
      name="keywords"
      content="abdullah imdad, abdullah imdad lakho, abdullah imdad portfolio, abdullah imdad duet, bs artificial intelligence student karachi, ai student portfolio pakistan, dawood university of engineering and technology, duet karachi, machine learning student, data analysis, c programming, artificial intelligence portfolio"

    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Self-referencing canonical. Keep this in sync with robots.txt,
         sitemap.xml and the JSON-LD "url" below when the domain changes. -->
    <link rel="canonical" href="https://abdullah-imdad-lakho.vercel.app/" />

    <!-- Open Graph: controls the link preview on LinkedIn, WhatsApp, Facebook, Slack. -->

    <meta property="og:site_name" content="Abdullah Imdad Lakho" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://abdullah-imdad-lakho.vercel.app/" />

      content="Explore the academic journey, technical interests, skills, and achievements of Abdullah Imdad Lakho, a BS Artificial Intelligence student at DUET Karachi."
    />

         images aggressively and will otherwise keep serving the old card. -->

    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"

    />
    <meta property="profile:first_name" content="Abdullah" />
    <meta property="profile:last_name" content="Imdad Lakho" />

    <!-- Twitter/X card: falls back to og:image when this is absent, but
         explicit is safer because Twitter does not read all OG fields. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Abdullah Imdad Lakho | BS Artificial Intelligence Student" />
    <meta
      name="twitter:description"

    />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />

    <!-- Critical font: self-hosted variable Plus Jakarta Sans (one file, all weights). -->
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Hero portrait (LCP on tablet/desktop). Mirrors the <picture> in Hero.tsx;
         media-gated because phones get a text-only hero and never load it. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/abdullah-hero-portrait.webp"
